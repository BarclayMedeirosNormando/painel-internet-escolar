name: Publicar front (GitHub Pages)
on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Carimbar versão no service worker (todo deploy = atualização para todos)
        run: sed -i "s/__BUILD__/${GITHUB_SHA::10}/" web/sw.js
      - name: Endereço da API (variável do repositório PAINEL_API, se definida)
        env:
          API_URL: ${{ vars.PAINEL_API }}
        run: |
          if [ -n "$API_URL" ]; then echo "window.PAINEL_API = \"$API_URL\";" > web/config.js; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
